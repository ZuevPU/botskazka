<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бот сказкотерапии</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__inner">
        <div class="header__brand">
          <span class="header__icon" aria-hidden="true">✦</span>
          <div>
            <h1 class="header__title">Бот сказкотерапии</h1>
            <p class="header__subtitle">Мягкий диалог через метафору и сказку</p>
          </div>
        </div>
        <button type="button" class="btn btn--ghost" id="btnRestart" title="Начать заново">
          Новая история
        </button>
      </div>
    </header>

    <main class="main">
      <div class="chat" id="chat" role="log" aria-live="polite" aria-label="Диалог со сказкотерапевтом"></div>

      <div class="quick-picks" id="quickPicks" hidden>
        <p class="quick-picks__label">Или выбери направление:</p>
        <div class="quick-picks__buttons">
          <button type="button" class="chip" data-topic="fear">история про страх</button>
          <button type="button" class="chip" data-topic="fatigue">история про усталость</button>
          <button type="button" class="chip" data-topic="path">история про поиск пути</button>
        </div>
      </div>

      <form class="input-bar" id="inputForm">
        <label class="visually-hidden" for="userInput">Ваше сообщение</label>
        <textarea
          id="userInput"
          class="input-bar__field"
          rows="1"
          placeholder="Напишите ответ..."
          autocomplete="off"
        ></textarea>
        <button type="submit" class="btn btn--send" id="btnSend" aria-label="Отправить">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </main>

    <footer class="footer">
      <p>Инструмент рефлексии через метафору · не заменяет профессиональную помощь</p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
